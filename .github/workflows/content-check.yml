name: Content check

# Read-only: PR checks, plus a weekly run of the example import/parse tests against the EXACT
# versions in examples/langchain-v1/requirements-verified.txt (a pip freeze of the verified env).
# Warnings (e.g. stale last_verified) never fail the run; they print to stderr and the job summary.
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Node regression tests (lint logic)
        run: npm test
      - name: Content lint (model IDs, deprecations, last_verified, python fence syntax)
        run: npm run check:content
      - name: Typecheck
        run: npm run typecheck
      - name: Build site
        run: npm run build

  examples-pinned:
    # EXACT versions from examples/langchain-v1/requirements-verified.txt (pip freeze of the verified
    # env). Tier 2 pages (TIER2_PAGES) are imported and parsed offline; nothing runs against live APIs.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/langchain-v1/requirements-verified.txt
      - run: pip install -r examples/langchain-v1/requirements-verified.txt
      - run: python examples/langchain-v1/check_doc_imports.py
      - run: pytest examples/langchain-v1

  examples-tier1-imports:
    # NOT pinned: requirements-<framework>.txt install latest releases in isolated environments.
    # Run on PRs as well, so migrated Tier 1 content cannot merge without import/smoke checks.
    # Monthly latest failures additionally open a deduplicated issue in monthly-latest.yml.
    name: examples-tier1 (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: openai
            page: docs/frameworks/openai-responses-and-agents-sdk.md
          - framework: microsoft
            page: docs/frameworks/microsoft-agent-framework.md
          - framework: llamaindex
            page: docs/frameworks/llamaindex-agents.md
          - framework: crewai
            page: docs/frameworks/crewai-guide.md docs/implementations/multi-agent-crew.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r examples/tier1/requirements-${{ matrix.framework }}.txt
      - name: Import check (exact page)
        run: python examples/langchain-v1/check_doc_imports.py ${{ matrix.page }}
      - name: Offline smoke tests
        run: pytest examples/tier1/${{ matrix.framework }}
