name: Monthly latest-framework check

# Installs the LATEST releases (no version caps) of the packages behind the TRACKED migrated
# examples only -- the Tier 2 pages (TIER2_PAGES) in one environment and the Tier 1 new-API pages
# (TIER1_PAGES) in one isolated environment per framework (matrix) -- and runs the import/parse checks, so genuine upstream breaks
# surface. Pages outside those lists, and archived legacy pages (autogen-guide, semantic-kernel),
# are not covered. Nothing runs against live APIs. Scheduled failures open (or update) one
# deduplicated issue; manual runs only report in the run itself.
on:
  schedule:
    - cron: "23 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build an unpinned requirements list
        # Strips every version specifier and comment (keeps extras such as langchain[mcp]) so
        # known pins in requirements.txt -- e.g. langchain-community<0.4.2 for ragas -- are NOT
        # carried over and cannot hide a break.
        run: |
          sed -E 's/[[:space:]]*#.*$//; s/[<>=!~].*$//; /^[[:space:]]*$/d' \
            examples/langchain-v1/requirements.txt > "$RUNNER_TEMP/requirements-latest.txt"
          cat "$RUNNER_TEMP/requirements-latest.txt"
          if grep -E '[<>=!~]' "$RUNNER_TEMP/requirements-latest.txt"; then
            echo "version specifier survived in the latest list" >&2
            exit 1
          fi
      - name: Upgrade everything to latest (eager)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -r "$RUNNER_TEMP/requirements-latest.txt"
          # Explicit, uncapped: surface the ragas / langchain-community incompatibility if it persists.
          python -m pip install --upgrade --upgrade-strategy eager langchain-community ragas
      - name: Record resolved versions
        run: |
          {
            echo "### Resolved versions"
            pip list --format=freeze | grep -iE '^(langchain|langgraph|ragas|mcp|anthropic|datasets|pydantic)' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Doc import check (tracked Tier 2 pages)
        run: python examples/langchain-v1/check_doc_imports.py
      - name: Example tests
        run: pytest examples/langchain-v1

  latest-tier1:
    # One isolated environment per framework (their dependency ranges conflict, and the umbrella
    # agent-framework meta-package is huge). fail-fast is off so every framework reports; the job
    # result is "failure" if ANY leg fails, which opens the deduplicated issue below.
    name: latest-tier1 (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: openai
            page: docs/frameworks/openai-responses-and-agents-sdk.md
            freeze: '^(openai|openai-agents|pydantic)=='
          - framework: microsoft
            page: docs/frameworks/microsoft-agent-framework.md
            freeze: '^(agent-framework|opentelemetry-(sdk|exporter-otlp)|pydantic)'
          - framework: llamaindex
            page: docs/frameworks/llamaindex-agents.md
            freeze: '^(llama-index|openai|pydantic)'
          - framework: crewai
            page: docs/frameworks/crewai-guide.md docs/implementations/multi-agent-crew.md
            freeze: '^(crewai|openai|pydantic)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build an unpinned requirements list
        run: |
          sed -E 's/[[:space:]]*#.*$//; s/[<>=!~].*$//; /^[[:space:]]*$/d' \
            "examples/tier1/requirements-${{ matrix.framework }}.txt" > "$RUNNER_TEMP/requirements-latest.txt"
          cat "$RUNNER_TEMP/requirements-latest.txt"
          if grep -E '[<>=!~]' "$RUNNER_TEMP/requirements-latest.txt"; then
            echo "version specifier survived in the latest list" >&2
            exit 1
          fi
      - name: Upgrade everything to latest (eager)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -r "$RUNNER_TEMP/requirements-latest.txt"
      - name: Record resolved versions
        run: |
          {
            echo "### Resolved versions (Tier 1 / ${{ matrix.framework }})"
            pip list --format=freeze | grep -iE '${{ matrix.freeze }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Doc import check (exact page)
        run: python examples/langchain-v1/check_doc_imports.py ${{ matrix.page }}
      - name: Offline smoke tests
        run: pytest examples/tier1/${{ matrix.framework }}

  report:
    needs: [latest, latest-tier1]
    if: ${{ always() && github.event_name == 'schedule' && (needs.latest.result == 'failure' || needs.latest-tier1.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the deduplicated issue
        uses: actions/github-script@v7
        with:
          script: |
            // Only safe context fields; never raw logs.
            const label = 'latest-framework-check';
            const title = 'Monthly latest-framework check failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205',
                description: 'Opened by the monthly latest-framework workflow' });
            } catch (e) { if (e.status !== 422) throw e; }
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 10 });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            const body = `Scheduled run on ${date} failed: ${runUrl}\n\n` +
              'Open the run for step output and the resolved-versions summary. ' +
              'This job installs the latest releases with no version caps, so a failure usually means a ' +
              'genuine upstream change; update the docs/examples (or the pins in ' +
              '`examples/langchain-v1/requirements.txt`) accordingly.';
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, labels: [label], body });
            }
